name: taxfix-hack

# App secrets: apps/web/.env
# Tunnel token: gitignored .env.local (TUNNEL_TOKEN). Compose 2.23 cannot use the
# path/required env_file object syntax — keep these as strings.
services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      secrets:
        - web_env
    init: true
    ports:
      - "3001:3001"
    env_file:
      - apps/web/.env
    environment:
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3001}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
      DATABASE_URL: file:/data/local.db
    volumes:
      - type: bind
        source: ./.data
        target: /data
        bind:
          create_host_path: false
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    env_file:
      - .env.local
    depends_on:
      web:
        condition: service_healthy

# BuildKit makes these available only while install/build commands run.
secrets:
  web_env:
    file: apps/web/.env
